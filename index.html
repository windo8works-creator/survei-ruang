<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Survei ruang</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --ink: #0e1013; --paper: #15181d; --raised: #1c2026; --rule: #2a3039;
    --text: #eceef2; --muted: #8b929d; --accent: #c9a46a; --accent-soft: rgba(201,164,106,0.14);
    --accent-ink: #1b1409; --bad: #e6725f; --warn: #e2ab4f; --ok: #86c9a0; --radius: 14px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--text); font-family: var(--font); }
  body { font-size: 15px; line-height: 1.35; }
  button, input { font: inherit; color: inherit; }
  button { touch-action: manipulation; cursor: pointer; border: 0; background: none; padding: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
  .num { font-variant-numeric: tabular-nums; }

  /* kerangka: area gulir di atas, papan angka tertambat di bawah */
  .app { height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }
  .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
            padding: calc(10px + env(safe-area-inset-top)) 14px 14px; }
  .dock { flex: none; background: var(--paper); border-top: 1px solid var(--rule);
          padding: 8px 14px calc(10px + env(safe-area-inset-bottom));
          --key: 44px; --key: clamp(34px, 5.6vh, 48px); --key: clamp(34px, 5.6dvh, 48px); }
  body.typing .dock { display: none; }

  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .brand { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 9px; background: #ffffff; overflow: hidden; padding: 2px; }
  .brand img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .head h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .head p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }

  .field { display: block; text-align: left; background: var(--raised); border: 1px solid var(--rule); border-radius: 12px; padding: 7px 12px; min-height: 52px; }
  .field small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 1px; }
  .field input { background: transparent; border: 0; padding: 0; font-size: 16px; width: 100%; outline: none; }
  .field input::placeholder { color: #50565f; }
  .field:focus-within { border-color: var(--accent); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; gap: 3px; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; margin-bottom: 8px; }
  .tab { min-height: 36px; border-radius: 9px; color: var(--muted); font-size: 13px; font-weight: 500; }
  .tab[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--rule); }
  .tab[aria-pressed="true"]::after { content: ""; display: block; width: 16px; height: 2px; margin: 2px auto 0; border-radius: 2px; background: var(--accent); }

  .plan { background-color: var(--paper);
          background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
          background-size: 22px 22px; background-position: -1px -1px;
          border: 1px solid var(--rule); border-radius: var(--radius); padding: 6px 8px 6px; margin-bottom: 8px; }
  .plan svg, .plan .empty { width: 100%; height: 100px; height: clamp(88px, 15vh, 150px); height: clamp(88px, 15dvh, 150px); display: block; }
  .plan .empty { display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 0 20px; }
  .status { margin: 3px 4px 0; font-size: 12px; color: var(--muted); min-height: 16px; }
  .status.ok { color: var(--ok); } .status.warn { color: var(--warn); } .status.bad { color: var(--bad); }

  .cells { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .cells.two-col { grid-template-columns: repeat(2, 1fr); }
  .cell { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 7px 10px; min-height: 52px; text-align: left; }
  .cell small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; min-height: 24px; }
  .cell[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .cell.invalid b { color: var(--bad); }

  .chips-row { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
  .chips { flex: 1; display: flex; flex-wrap: wrap; gap: 5px; min-height: 28px; }
  .chip { background: var(--raised); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 9px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .undo { flex: none; min-height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--rule); color: var(--muted); font-size: 13px; }
  .undo:active { color: var(--text); }

  details { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
  summary { min-height: 44px; display: flex; align-items: center; padding: 0 14px; cursor: pointer; font-size: 14px; color: var(--muted); list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; margin-left: auto; font-size: 18px; color: var(--muted); }
  details[open] summary::after { content: "\2013"; }
  details[open] summary { color: var(--text); border-bottom: 1px solid var(--rule); }
  details > div { padding: 10px 12px 12px; }
  .kind { margin-bottom: 10px; }
  .kind h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--text); }
  .orow { display: grid; grid-template-columns: repeat(3, 1fr) 34px; gap: 6px; margin-bottom: 6px; align-items: stretch; }
  .orow .cell { min-height: 46px; padding: 5px 8px; }
  .orow .cell b { font-size: 17px; min-height: 21px; }
  .del { border-radius: 10px; border: 1px solid var(--rule); color: var(--muted); font-size: 16px; }
  .del:active { color: var(--bad); border-color: var(--bad); }
  .add { width: 100%; min-height: 38px; border-radius: 10px; border: 1px dashed var(--rule); color: var(--accent); font-size: 13px; }
  .add[disabled] { color: var(--muted); opacity: 0.5; }
  .hint { color: var(--muted); font-size: 11px; margin: 6px 0 0; }
  .row-label { color: var(--muted); font-size: 12px; margin: 0 0 6px; }

  /* papan angka */
  .disp { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-height: 30px; margin-bottom: 6px; }
  .disp span { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .disp b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .disp b.invalid { color: var(--bad); }
  .disp .undo { margin-left: 4px; }
  .disp .undo[hidden] { display: none; }
  .pad { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: var(--key); gap: 6px; margin-bottom: 8px; }
  .key, .side { border-radius: 12px; font-variant-numeric: tabular-nums; }
  .key { background: var(--raised); font-size: 22px; font-weight: 500; }
  .key:active { background: #2a2f38; transform: scale(0.98); }
  .side { border: 1px solid var(--rule); background: var(--paper); font-size: 13px; color: var(--muted); }
  .side.nav { color: var(--accent); border-color: rgba(201,164,106,0.4); background: #1b1913; }
  .side.dir { color: var(--accent); border-color: rgba(201,164,106,0.5); background: #1b1913; font-size: 17px; }
  .side:active { background: var(--accent-soft); border-color: var(--accent); }
  .msg { min-height: 16px; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg.bad { color: var(--bad); } .msg.ok { color: var(--accent); }
  .go { width: 100%; height: 48px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 650; letter-spacing: 0.01em; }
  .go:active { transform: scale(0.99); }
  .go[aria-disabled="true"] { background: var(--raised); color: #5b626c; }
  @media (max-width: 345px) { .side { font-size: 11px; } .side.dir { font-size: 15px; } .disp b { font-size: 22px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <main class="scroll" id="scroll">
    <header class="head">
      <div class="brand" aria-hidden="true">
        <img src="logo.png" alt="" onerror="var p=this.parentNode;this.remove();p.textContent='HW';">
      </div>
      <div><h1>Survei ruang</h1><p>Isi ukuran, lalu proses gambar dan QTO</p></div>
    </header>

    <div class="two">
      <label class="field"><small>Nama proyek</small>
        <input id="proyek" type="text" maxlength="40" autocomplete="off" list="daftar-proyek" placeholder="RUMAH-BUDI" aria-label="Nama proyek"></label>
      <label class="field"><small>Nama ruang</small>
        <input id="nama" type="text" maxlength="40" autocomplete="off" autocapitalize="words" placeholder="Ruang tamu" aria-label="Nama ruang"></label>
    </div>
    <datalist id="daftar-proyek"></datalist>

    <div class="tabs" role="group" aria-label="Mode ukur">
      <button class="tab" type="button" data-mode="kotak" aria-pressed="true">Kotak siku</button>
      <button class="tab" type="button" data-mode="keliling" aria-pressed="false">Leter-L / U</button>
      <button class="tab" type="button" data-mode="miring" aria-pressed="false">Miring</button>
    </div>

    <div class="plan"><div id="plan"></div><div class="status" id="status" aria-live="polite"></div></div>

    <div id="fields"></div>

    <details id="bukaan">
      <summary>Pintu, jendela, kolom</summary>
      <div>
        <div class="kind" data-kind="pintu"></div>
        <div class="kind" data-kind="jendela"></div>
        <div class="kind" data-kind="kolom"></div>
        <p class="hint">Satu baris per ukuran. Baris yang kosong diabaikan. Maksimal 6 ukuran per jenis.</p>
      </div>
    </details>

    <details id="lanjutan">
      <summary>Lanjutan</summary>
      <div>
        <div class="row-label">Dinding lengkung (hanya mode kotak): bentang dan tinggi perut (m)</div>
        <div class="cells two-col" data-group="lengkung"></div>
        <label class="field" style="margin-top:6px"><small>Alasan paksa (hanya bila celah di atas 50 mm sudah dicek)</small>
          <input id="paksa" type="text" maxlength="120" autocomplete="off" placeholder="sudah diukur ulang di lapangan" aria-label="Alasan paksa"></label>
      </div>
    </details>
  </main>

  <section class="dock" id="dock" aria-label="Papan angka">
    <div class="disp"><span id="dispLabel"></span><b id="dispVal" class="num"></b><button class="undo" id="undoDock" type="button" hidden>↶ Urungkan</button></div>
    <div class="pad" id="pad"></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <button class="go" id="go" type="button" aria-disabled="true">Proses CAD &amp; QTO</button>
  </section>
</div>

<script id="logic">
/* Logika murni (tanpa DOM): aturan harus sama dengan survei_bot_daemon.py */
(function (root) {
  'use strict';
  var R = {
    tinggi: [1.5, 15], p: [0.3, 100], l: [0.3, 100], seg: [0.05, 100], sisi: [0.3, 100],
    diag: [0.3, 200], chord: [0.3, 50], sagitta: [0.02, 25], qty: [1, 50],
    bw: [0.05, 10], bh: [0.05, 10], kw: [0.05, 5], kt: [0.05, 5]
  };
  var KINDS = {
    pintu: { label: 'Pintu', rw: R.bw, rh: R.bh, third: 'Tinggi' },
    jendela: { label: 'Jendela', rw: R.bw, rh: R.bh, third: 'Tinggi' },
    kolom: { label: 'Kolom', rw: R.kw, rh: R.kt, third: 'Tebal' }
  };
  var SEG_MIN = 4, SEG_MAX = 60, MAX_BYTES = 4096, MAX_OPEN = 6;
  var NUM_RE = /^\d{1,3}(\.\d{1,3})?$/;
  var QTY_RE = /^\d{1,2}$/;
  var NAME_RE = /^[A-Za-z0-9][A-Za-z0-9 _-]{0,39}$/;
  var PAKSA_RE = /^[A-Za-z0-9][A-Za-z0-9 ,._()\/:-]{4,119}$/;
  var DIRS = { U: [0, 1], T: [1, 0], S: [0, -1], B: [-1, 0] };
  var GAP_WARN = 10, GAP_REJECT = 50, GAP_OPEN = 500;

  function parse(s) { return NUM_RE.test(s || '') ? Number(s) : NaN; }
  function parseQty(s) { return QTY_RE.test(s || '') ? Number(s) : NaN; }
  function inRange(v, r) { return isFinite(v) && v >= r[0] && v <= r[1]; }
  function fmt(n) { return String(Number(n.toFixed(3))); }
  function g(state, id) { return (state.vals && state.vals[id]) || ''; }

  function geometry(state) {
    var m = state.mode, pts, labels;
    if (m === 'kotak') {
      var p = parse(g(state, 'kotak.p')), l = parse(g(state, 'kotak.l'));
      if (!inRange(p, R.p) || !inRange(l, R.l)) return { pts: null };
      return { pts: [[0, 0], [0, l], [p, l], [p, 0]], closed: true, labels: [l, p, l, p], gap: 0 };
    }
    if (m === 'keliling') {
      pts = [[0, 0]]; labels = [];
      (state.segs || []).forEach(function (s) {
        var d = parse(s.v), v = DIRS[s.d];
        if (!(d > 0) || !v) return;
        var last = pts[pts.length - 1];
        pts.push([last[0] + v[0] * d, last[1] + v[1] * d]);
        labels.push(d);
      });
      if (pts.length < 2) return { pts: null };
      var e = pts[pts.length - 1];
      return { pts: pts, closed: false, labels: labels, gap: Math.hypot(e[0] - pts[0][0], e[1] - pts[0][1]) };
    }
    var A = parse(g(state, 'miring.A')), B = parse(g(state, 'miring.B')), C = parse(g(state, 'miring.C')),
        D = parse(g(state, 'miring.D')), dg = parse(g(state, 'miring.diag'));
    if (![A, B, C, D, dg].every(function (x) { return x > 0; })) return { pts: null };
    var y3 = (dg * dg + A * A - B * B) / (2 * A), x2 = dg * dg - y3 * y3;
    if (x2 < -1e-9) return { pts: null, error: 'Diagonal tidak cocok dengan sisi A dan B.' };
    var x3 = Math.sqrt(Math.max(0, x2));
    var cb = (dg * dg + D * D - C * C) / (2 * dg * D);
    if (cb < -1 || cb > 1) return { pts: null, error: 'Sisi C dan D tidak cocok dengan diagonal.' };
    var th4 = Math.atan2(y3, x3) - Math.acos(cb);
    return { pts: [[0, 0], [0, A], [x3, y3], [D * Math.cos(th4), D * Math.sin(th4)]],
             closed: true, labels: [A, B, C, D], gap: 0 };
  }

  function area(pts) {
    var s = 0;
    for (var i = 0; i < pts.length; i++) {
      var a = pts[i], b = pts[(i + 1) % pts.length];
      s += a[0] * b[1] - b[0] * a[1];
    }
    return Math.abs(s) / 2;
  }

  /* baris ukuran bukaan: state.open[kind] = [{q, w, h}, ...] */
  function openRows(state, kind) { return (state.open && state.open[kind]) || []; }
  function rowStatus(r, cfg) {
    if (!r.q && !r.w && !r.h) return { empty: true };
    var q = parseQty(r.q), w = parse(r.w), h = parse(r.h);
    return { ok: inRange(q, R.qty) && inRange(w, cfg.rw) && inRange(h, cfg.rh), q: q, w: w, h: h };
  }

  function validate(state) {
    var errors = [], warnings = [], geo = geometry(state), m = state.mode;
    var nama = (state.nama || '').trim(), proyek = (state.proyek || '').trim(), paksa = (state.paksa || '').trim();
    if (!NAME_RE.test(nama)) errors.push('Nama ruang: huruf, angka, spasi, - dan _ (maksimal 40).');
    if (!proyek) errors.push('Nama proyek wajib diisi, supaya hasil masuk ke folder yang benar.');
    else if (!NAME_RE.test(proyek)) errors.push('Nama proyek: huruf, angka, spasi, - dan _ (maksimal 40).');
    if (!inRange(parse(g(state, 'tinggi')), R.tinggi)) errors.push('Tinggi plafon harus antara 1,5 dan 15 m.');

    if (m === 'kotak') {
      if (!inRange(parse(g(state, 'kotak.p')), R.p)) errors.push('Panjang harus antara 0,3 dan 100 m.');
      if (!inRange(parse(g(state, 'kotak.l')), R.l)) errors.push('Lebar harus antara 0,3 dan 100 m.');
    } else if (m === 'keliling') {
      var n = (state.segs || []).length;
      if (n < SEG_MIN || n > SEG_MAX) errors.push('Jumlah sisi harus ' + SEG_MIN + ' sampai ' + SEG_MAX + '.');
      (state.segs || []).forEach(function (s) {
        if (!inRange(parse(s.v), R.seg) || !DIRS[s.d]) errors.push('Ada sisi dengan panjang tidak valid.');
      });
      if (g(state, 'cur')) errors.push('Ada panjang sisi yang belum diberi arah.');
      if (geo.pts && n >= SEG_MIN && geo.gap * 1000 > GAP_REJECT && !PAKSA_RE.test(paksa)) {
        if (geo.gap * 1000 > GAP_OPEN) errors.push('Jalur belum kembali ke titik awal (selisih ' + geo.gap.toFixed(2).replace('.', ',') + ' m). Lanjutkan sisi atau periksa arah.');
        else errors.push('Celah penutup ' + Math.round(geo.gap * 1000) + ' mm di atas 50 mm. Periksa sisi dan arah, atau isi alasan paksa di Lanjutan.');
      } else if (geo.pts && geo.gap * 1000 >= GAP_WARN && geo.gap * 1000 <= GAP_REJECT)
        warnings.push('Celah penutup ' + Math.round(geo.gap * 1000) + ' mm: perlu cek ulang.');
    } else {
      [['A', 'sisi'], ['B', 'sisi'], ['C', 'sisi'], ['D', 'sisi'], ['diag', 'diag']].forEach(function (x) {
        if (!inRange(parse(g(state, 'miring.' + x[0])), R[x[1]])) errors.push('Isian ' + (x[0] === 'diag' ? 'diagonal' : 'sisi ' + x[0]) + ' belum valid.');
      });
      if (geo.error) errors.push(geo.error);
    }

    Object.keys(KINDS).forEach(function (kind) {
      var cfg = KINDS[kind], rows = openRows(state, kind), terisi = 0;
      rows.forEach(function (r, i) {
        var st = rowStatus(r, cfg);
        if (st.empty) return;
        terisi++;
        if (!st.ok) errors.push(cfg.label + ' ' + (i + 1) + ': isi jumlah, lebar, dan ' + cfg.third.toLowerCase() + ' dengan benar, atau kosongkan baris itu.');
      });
      if (terisi > MAX_OPEN) errors.push(cfg.label + ': maksimal ' + MAX_OPEN + ' ukuran berbeda.');
    });

    var lc = g(state, 'lengkung.c'), ls = g(state, 'lengkung.s');
    if (lc || ls) {
      if (m !== 'kotak') errors.push('Lengkung hanya untuk mode kotak.');
      else if (!inRange(parse(lc), R.chord) || !inRange(parse(ls), R.sagitta)) errors.push('Lengkung: bentang 0,3 sampai 50 m, tinggi perut 0,02 sampai 25 m.');
      else if (parse(ls) >= parse(lc) / 2) errors.push('Tinggi perut lengkung harus lebih kecil dari setengah bentang.');
    }
    if (paksa && !PAKSA_RE.test(paksa)) errors.push('Alasan paksa: 5 sampai 120 karakter, huruf, angka, dan tanda baca sederhana.');

    var payload = null;
    if (!errors.length) {
      payload = buildPayload(state);
      var bytes = new TextEncoder().encode(JSON.stringify(payload)).length;
      if (bytes > MAX_BYTES) { errors.push('Data terlalu besar untuk dikirim.'); payload = null; }
    }
    return { errors: errors, warnings: warnings, payload: payload, geo: geo };
  }

  function bukaanList(state, kind) {
    var cfg = KINDS[kind], out = [];
    openRows(state, kind).forEach(function (r) {
      var st = rowStatus(r, cfg);
      if (!st.empty && st.ok) out.push(st.q + 'x(' + fmt(st.w) + 'x' + fmt(st.h) + ')');
    });
    return out;
  }

  function buildPayload(state) {
    var m = state.mode, o = { v: 1, action: 'survei_ruang', nama: (state.nama || '').trim(), mode: m,
                              tinggi: Number(fmt(parse(g(state, 'tinggi')))) };
    var proyek = (state.proyek || '').trim();
    if (proyek) o.proyek = proyek;
    if (m === 'kotak') { o.p = Number(fmt(parse(g(state, 'kotak.p')))); o.l = Number(fmt(parse(g(state, 'kotak.l')))); }
    else if (m === 'keliling') o.arah = state.segs.map(function (s) { return s.d + ':' + fmt(parse(s.v)); }).join(' ');
    else {
      o.sisi = ['A', 'B', 'C', 'D'].map(function (k) { return fmt(parse(g(state, 'miring.' + k))); }).join(',');
      o.diag = Number(fmt(parse(g(state, 'miring.diag'))));
    }
    Object.keys(KINDS).forEach(function (k) { var v = bukaanList(state, k); if (v.length) o[k] = v; });
    if (m === 'kotak' && g(state, 'lengkung.c')) o.lengkung = fmt(parse(g(state, 'lengkung.c'))) + ',' + fmt(parse(g(state, 'lengkung.s')));
    var paksa = (state.paksa || '').trim();
    if (paksa) o.paksa = paksa;
    return o;
  }

  root.SurveiLogic = { R: R, KINDS: KINDS, MAX_OPEN: MAX_OPEN, parse: parse, geometry: geometry, area: area,
                       validate: validate, buildPayload: buildPayload, fmt: fmt,
                       GAP_WARN: GAP_WARN, GAP_REJECT: GAP_REJECT, GAP_OPEN: GAP_OPEN };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script id="ui">
(function () {
  'use strict';
  var L = window.SurveiLogic;
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTelegram = !!(tg && tg.platform && tg.platform !== 'unknown');
  var DRAFT = 'survei-draft-v2', PROJ_KEY = 'survei-proyek-v1';
  var DIR_ARROW = { U: '\u2191', T: '\u2192', S: '\u2193', B: '\u2190' };
  var DIR_NAME = { U: 'Utara', T: 'Timur', S: 'Selatan', B: 'Barat' };
  var KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'back'];
  var LABEL = {
    tinggi: 'Tinggi plafon (m)', 'kotak.p': 'Panjang (m)', 'kotak.l': 'Lebar (m)',
    'miring.A': 'Sisi 1-2 (A)', 'miring.B': 'Sisi 2-3 (B)', 'miring.C': 'Sisi 3-4 (C)', 'miring.D': 'Sisi 4-1 (D)',
    'miring.diag': 'Diagonal 1-3 (m)', cur: 'Panjang sisi berikutnya (m)',
    'lengkung.c': 'Lengkung: bentang (m)', 'lengkung.s': 'Lengkung: tinggi perut (m)'
  };

  function newRow() { return { q: '', w: '', h: '' }; }
  function defaultActive(mode) { return mode === 'keliling' ? 'cur' : (mode === 'miring' ? 'miring.A' : 'kotak.p'); }
  function $(id) { return document.getElementById(id); }

  function loadDraft() {
    try {
      var d = JSON.parse(localStorage.getItem(DRAFT) || 'null');
      if (!d || !d.vals || !Array.isArray(d.segs)) return null;
      d.open = d.open || {};
      ['pintu', 'jendela', 'kolom'].forEach(function (k) {
        if (!Array.isArray(d.open[k]) || !d.open[k].length) d.open[k] = [newRow()];
        d.open[k] = d.open[k].slice(0, L.MAX_OPEN);
      });
      return d;
    } catch (e) { return null; }
  }
  var state = loadDraft() || { nama: '', proyek: '', paksa: '', mode: 'kotak', vals: { tinggi: '3' }, segs: [],
                               open: { pintu: [newRow()], jendela: [newRow()], kolom: [newRow()] } };
  state.active = defaultActive(state.mode);
  var fresh = true, padMode = null;

  function saveDraft() {
    try { localStorage.setItem(DRAFT, JSON.stringify({ nama: state.nama, proyek: state.proyek, paksa: state.paksa,
      mode: state.mode, vals: state.vals, segs: state.segs, open: state.open })); } catch (e) {}
  }
  function clearDraft() { try { localStorage.removeItem(DRAFT); } catch (e) {} }
  function haptic(kind) {
    try { if (tg && tg.HapticFeedback) { kind === 'bad' ? tg.HapticFeedback.notificationOccurred('error') : tg.HapticFeedback.impactOccurred('light'); } } catch (e) {}
  }

  /* daftar proyek yang pernah dipakai di HP ini */
  function rememberProject(n) {
    try {
      var a = JSON.parse(localStorage.getItem(PROJ_KEY) || '[]');
      if (!Array.isArray(a)) a = [];
      if (a.indexOf(n) < 0) a.push(n);
      a.sort();
      localStorage.setItem(PROJ_KEY, JSON.stringify(a.slice(0, 50)));
    } catch (e) {}
  }
  function fillProjects() {
    var dl = $('daftar-proyek'); dl.textContent = '';
    try {
      var a = JSON.parse(localStorage.getItem(PROJ_KEY) || '[]');
      (Array.isArray(a) ? a : []).forEach(function (n) { var o = document.createElement('option'); o.value = n; dl.appendChild(o); });
    } catch (e) {}
  }

  /* akses isian: id biasa ('kotak.p') atau baris bukaan ('open:jendela:1:w') */
  function parseId(id) { var p = id.split(':'); return p[0] === 'open' ? { kind: p[1], idx: Number(p[2]), f: p[3] } : null; }
  function getVal(id) {
    var o = parseId(id);
    if (o) { var r = state.open[o.kind][o.idx]; return r ? r[o.f] : ''; }
    return state.vals[id] || '';
  }
  function setVal(id, v) {
    var o = parseId(id);
    if (o) { var r = state.open[o.kind][o.idx]; if (r) r[o.f] = v; } else state.vals[id] = v;
  }
  function labelFor(id) {
    var o = parseId(id);
    if (o) {
      var cfg = L.KINDS[o.kind];
      return cfg.label + ' ' + (o.idx + 1) + ': ' + (o.f === 'q' ? 'jumlah' : (o.f === 'w' ? 'lebar (m)' : cfg.third.toLowerCase() + ' (m)'));
    }
    return LABEL[id] || id;
  }
  function display(v) { return v ? v.replace('.', ',') : '\u2013'; }
  function isValid(id, v) {
    if (!v) return true;
    var R = L.R, o = parseId(id), n;
    if (o) {
      var cfg = L.KINDS[o.kind];
      if (o.f === 'q') return /^\d{1,2}$/.test(v) && Number(v) >= 1 && Number(v) <= 50;
      n = L.parse(v);
      var rg = o.f === 'w' ? cfg.rw : cfg.rh;
      return isFinite(n) && n >= rg[0] && n <= rg[1];
    }
    var map = { tinggi: R.tinggi, 'kotak.p': R.p, 'kotak.l': R.l, 'miring.A': R.sisi, 'miring.B': R.sisi, 'miring.C': R.sisi,
                'miring.D': R.sisi, 'miring.diag': R.diag, cur: R.seg, 'lengkung.c': R.chord, 'lengkung.s': R.sagitta };
    n = L.parse(v);
    return isFinite(n) && map[id] && n >= map[id][0] && n <= map[id][1];
  }

  function select(id) { state.active = id; fresh = true; render(); scrollKeAktif(); }
  function scrollKeAktif() {
    var el = document.querySelector('[data-id="' + state.active + '"]');
    if (el && typeof el.scrollIntoView === 'function') { try { el.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
  }
  function mkCell(id, label) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'cell'; b.dataset.id = id;
    b.setAttribute('aria-pressed', String(state.active === id));
    var s = document.createElement('small'); s.textContent = label;
    var v = document.createElement('b'); v.className = 'num'; v.textContent = display(getVal(id));
    if (!isValid(id, getVal(id))) b.classList.add('invalid');
    b.appendChild(s); b.appendChild(v);
    b.addEventListener('click', function () { select(id); });
    return b;
  }

  var MODE_FIELDS = {
    kotak: [['kotak.p', 'Panjang (m)'], ['kotak.l', 'Lebar (m)'], ['tinggi', 'Tinggi (m)']],
    miring: [['miring.A', 'Sisi 1-2 (A)'], ['miring.B', 'Sisi 2-3 (B)'], ['miring.C', 'Sisi 3-4 (C)'],
             ['miring.D', 'Sisi 4-1 (D)'], ['miring.diag', 'Diagonal 1-3'], ['tinggi', 'Tinggi (m)']]
  };
  function fieldList() {
    if (state.mode === 'keliling') return ['cur', 'tinggi'];
    return MODE_FIELDS[state.mode].map(function (f) { return f[0]; });
  }

  function renderFields() {
    var host = $('fields'); host.textContent = '';
    var grid = document.createElement('div'); grid.className = 'cells';
    if (state.mode === 'keliling') {
      grid.appendChild(mkCell('cur', 'Panjang sisi (m)'));
      var cnt = document.createElement('div'); cnt.className = 'cell'; cnt.setAttribute('aria-hidden', 'true');
      var s = document.createElement('small'); s.textContent = 'Sisi tercatat';
      var b = document.createElement('b'); b.className = 'num'; b.textContent = String(state.segs.length);
      cnt.appendChild(s); cnt.appendChild(b); grid.appendChild(cnt);
      grid.appendChild(mkCell('tinggi', 'Tinggi (m)'));
      host.appendChild(grid);
      var row = document.createElement('div'); row.className = 'chips-row';
      var chips = document.createElement('div'); chips.className = 'chips';
      state.segs.forEach(function (sg) {
        var c = document.createElement('span'); c.className = 'chip';
        c.textContent = DIR_ARROW[sg.d] + ' ' + display(sg.v); chips.appendChild(c);
      });
      row.appendChild(chips); host.appendChild(row);
    } else {
      MODE_FIELDS[state.mode].forEach(function (f) { grid.appendChild(mkCell(f[0], f[1])); });
      host.appendChild(grid);
    }
  }

  function renderOpen() {
    document.querySelectorAll('.kind').forEach(function (el) {
      var kind = el.dataset.kind, cfg = L.KINDS[kind], rows = state.open[kind];
      el.textContent = '';
      var h = document.createElement('h3'); h.textContent = cfg.label; el.appendChild(h);
      rows.forEach(function (r, i) {
        var row = document.createElement('div'); row.className = 'orow';
        row.appendChild(mkCell('open:' + kind + ':' + i + ':q', 'Jumlah'));
        row.appendChild(mkCell('open:' + kind + ':' + i + ':w', 'Lebar'));
        row.appendChild(mkCell('open:' + kind + ':' + i + ':h', cfg.third));
        var d = document.createElement('button'); d.type = 'button'; d.className = 'del';
        d.setAttribute('aria-label', 'Hapus baris ' + cfg.label + ' ' + (i + 1)); d.textContent = '\u00d7';
        d.addEventListener('click', function () { hapusBaris(kind, i); });
        row.appendChild(d);
        el.appendChild(row);
      });
      var a = document.createElement('button'); a.type = 'button'; a.className = 'add'; a.dataset.kind = kind;
      a.textContent = '+ Tambah ukuran ' + cfg.label.toLowerCase();
      if (rows.length >= L.MAX_OPEN) a.disabled = true;
      a.addEventListener('click', function () { tambahBaris(kind); });
      el.appendChild(a);
    });
  }
  function tambahBaris(kind) {
    var rows = state.open[kind];
    if (rows.length >= L.MAX_OPEN) return;
    rows.push(newRow());
    state.active = 'open:' + kind + ':' + (rows.length - 1) + ':q'; fresh = true;
    haptic(); render(); scrollKeAktif();
  }
  function hapusBaris(kind, i) {
    var rows = state.open[kind];
    if (rows.length <= 1) rows[0] = newRow(); else rows.splice(i, 1);
    var o = parseId(state.active);
    if (o && !state.open[o.kind][o.idx]) state.active = defaultActive(state.mode);
    haptic(); render();
  }
  function renderGroups() {
    var el = document.querySelector('[data-group="lengkung"]'); el.textContent = '';
    el.appendChild(mkCell('lengkung.c', 'Bentang')); el.appendChild(mkCell('lengkung.s', 'Tinggi perut'));
  }

  function buildPad() {
    var pad = $('pad'); pad.textContent = '';
    KEYS.forEach(function (k, i) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'key';
      b.style.gridColumn = String((i % 3) + 1); b.style.gridRow = String(Math.floor(i / 3) + 1);
      b.textContent = k === 'back' ? '\u232B' : (k === '.' ? ',' : k);
      b.setAttribute('aria-label', k === 'back' ? 'Hapus' : (k === '.' ? 'Koma' : k));
      b.addEventListener('click', function () { press(k); });
      pad.appendChild(b);
    });
    if (state.mode === 'keliling') {
      ['U', 'T', 'S', 'B'].forEach(function (d, i) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'side dir'; b.dataset.dir = d;
        b.style.gridColumn = '4'; b.style.gridRow = String(i + 1);
        b.textContent = DIR_ARROW[d]; b.setAttribute('aria-label', 'Arah ' + DIR_NAME[d]);
        b.addEventListener('click', function () { addSeg(d); });
        pad.appendChild(b);
      });
    } else {
      [['prev', '\u2039 Sebelum', '1 / span 2', -1], ['next', 'Lanjut \u203a', '3 / span 2', 1]].forEach(function (x) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'side nav'; b.dataset.nav = x[0];
        b.style.gridColumn = '4'; b.style.gridRow = x[2]; b.textContent = x[1];
        b.addEventListener('click', function () { navigasi(x[3]); });
        pad.appendChild(b);
      });
    }
    padMode = state.mode;
  }
  function daftarNavigasi() {
    var o = parseId(state.active);
    if (o) {   // di dalam bagian bukaan: urut seperti di layar
      return Array.prototype.map.call(document.querySelectorAll('[data-id^="open:"]'), function (e) { return e.dataset.id; });
    }
    if (state.active === 'lengkung.c' || state.active === 'lengkung.s') return ['lengkung.c', 'lengkung.s'];
    return fieldList();
  }
  function navigasi(delta) {
    var list = daftarNavigasi(), i = list.indexOf(state.active);
    i = i < 0 ? 0 : (i + delta + list.length) % list.length;
    select(list[i]);
  }

  function press(k) {
    var id = state.active, s = getVal(id), o = parseId(id);
    var qty = !!(o && o.f === 'q');
    if (fresh) { if (k !== 'back') s = ''; fresh = false; }
    if (k === 'back') s = s.slice(0, -1);
    else if (k === '.') { if (qty) return; if (!s) s = '0.'; else if (s.indexOf('.') < 0) s += '.'; else return; }
    else {
      var next = s === '0' ? k : s + k, parts = next.split('.');
      if (qty ? next.length > 2 : (parts[0].length > 3 || (parts[1] && parts[1].length > 3))) return;
      s = next;
    }
    setVal(id, s); haptic(); render();
  }
  function addSeg(d) {
    var v = state.vals.cur || '';
    if (!isValid('cur', v) || !v) { flash('Isi panjang sisi dulu (0,05 sampai 100 m), lalu tekan arah.', 'bad'); haptic('bad'); return; }
    if (state.segs.length >= 60) { flash('Maksimal 60 sisi.', 'bad'); return; }
    state.segs.push({ d: d, v: v }); state.vals.cur = ''; state.active = 'cur'; fresh = true; haptic(); render();
  }

  function planSvg(geo) {
    var host = $('plan'); host.textContent = '';
    if (!geo.pts) {
      var e = document.createElement('div'); e.className = 'empty';
      e.textContent = geo.error || (state.mode === 'keliling' ? 'Ketik panjang sisi, lalu tekan arah.' : 'Denah muncul setelah ukuran terisi.');
      host.appendChild(e); return;
    }
    var W = 340, H = 150, pad = 26, pts = geo.pts;
    var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });
    var minx = Math.min.apply(null, xs), maxx = Math.max.apply(null, xs), miny = Math.min.apply(null, ys), maxy = Math.max.apply(null, ys);
    var sc = Math.min((W - 2 * pad) / Math.max(maxx - minx, 0.01), (H - 2 * pad) / Math.max(maxy - miny, 0.01));
    function X(x) { return (pad + (x - minx) * sc + (W - 2 * pad - (maxx - minx) * sc) / 2).toFixed(1); }
    function Y(y) { return (H - pad - (y - miny) * sc - (H - 2 * pad - (maxy - miny) * sc) / 2).toFixed(1); }
    var NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Pratinjau denah ruang');
    function el(name, attrs, text) {
      var n = document.createElementNS(NS, name);
      Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
      if (text) n.textContent = text; svg.appendChild(n); return n;
    }
    var path = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p[0]) + ' ' + Y(p[1]); }).join(' ') + (geo.closed ? ' Z' : '');
    el('path', { d: path, fill: geo.closed ? 'rgba(197,168,128,0.08)' : 'none', stroke: '#c5a880', 'stroke-width': '2', 'stroke-linejoin': 'round' });
    var gapmm = geo.gap * 1000;
    if (!geo.closed && pts.length > 2) {
      var col = gapmm > L.GAP_REJECT ? '#e0675a' : (gapmm >= L.GAP_WARN ? '#e0a33a' : '#8f7b5c');
      var last = pts[pts.length - 1];
      el('line', { x1: X(last[0]), y1: Y(last[1]), x2: X(pts[0][0]), y2: Y(pts[0][1]), stroke: col, 'stroke-width': '1.5', 'stroke-dasharray': '4 3' });
    }
    el('circle', { cx: X(pts[0][0]), cy: Y(pts[0][1]), r: '4', fill: '#121214', stroke: '#c5a880', 'stroke-width': '2' });
    var cx = xs.reduce(function (a, b) { return a + b; }, 0) / xs.length, cy = ys.reduce(function (a, b) { return a + b; }, 0) / ys.length;
    if (geo.labels.length <= 12) {
      geo.labels.forEach(function (len, i) {
        var a = pts[i], b = pts[(i + 1) % pts.length];
        var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        var dx = (mx - cx) * sc, dy = -(my - cy) * sc, n = Math.hypot(dx, dy) || 1;
        el('text', { x: (Number(X(mx)) + dx / n * 11).toFixed(1), y: (Number(Y(my)) + dy / n * 11 + 3).toFixed(1), 'text-anchor': 'middle',
                     fill: '#9a9aa2', 'font-size': '10' }, String(Number(len.toFixed(2))).replace('.', ','));
      });
    }
    host.appendChild(svg);
  }

  function statusText(geo, res) {
    var st = $('status'); st.className = 'status'; st.textContent = '';
    if (!geo.pts) return;
    var a = L.area(geo.pts);
    if (state.mode === 'keliling') {
      var mm = Math.round(geo.gap * 1000);
      if (mm > L.GAP_OPEN) { st.className = 'status'; st.textContent = 'Jalur belum kembali ke titik awal: selisih ' + geo.gap.toFixed(2).replace('.', ',') + ' m.'; }
      else if (mm < L.GAP_WARN) { st.className = 'status ok'; st.textContent = 'Celah penutup ' + mm + ' mm, diterima. Luas dasar ' + a.toFixed(2).replace('.', ',') + ' m2.'; }
      else if (mm <= L.GAP_REJECT) { st.className = 'status warn'; st.textContent = 'Celah penutup ' + mm + ' mm: dikirim dengan tanda perlu cek ulang.'; }
      else { st.className = 'status bad'; st.textContent = 'Celah penutup ' + mm + ' mm: di atas 50 mm, ditolak kecuali diberi alasan paksa.'; }
    } else {
      st.className = 'status ok'; st.textContent = 'Luas dasar ' + a.toFixed(2).replace('.', ',') + ' m2 (sebelum bukaan dan kolom).';
    }
  }

  function flash(text, kind) { var m = $('msg'); m.textContent = text; m.className = 'msg ' + (kind || ''); }

  function render() {
    document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-pressed', String(t.dataset.mode === state.mode)); });
    if (padMode !== state.mode) buildPad();
    renderFields(); renderOpen(); renderGroups();
    $('undoDock').hidden = !(state.mode === 'keliling' && state.segs.length);
    var v = getVal(state.active);
    $('dispLabel').textContent = labelFor(state.active);
    $('dispVal').textContent = display(v);
    $('dispVal').className = 'num' + (isValid(state.active, v) ? '' : ' invalid');
    var res = L.validate(state);
    planSvg(res.geo); statusText(res.geo, res);
    var go = $('go');
    go.setAttribute('aria-disabled', String(res.errors.length > 0));
    var msg = $('msg');
    if (res.errors.length) { msg.className = 'msg'; msg.textContent = res.errors[0]; }
    else if (res.warnings.length) { msg.className = 'msg'; msg.textContent = res.warnings[0]; }
    else { msg.className = 'msg ok'; msg.textContent = 'Siap diproses.'; }
    saveDraft();
  }

  function send() {
    var res = L.validate(state);
    if (res.errors.length) { flash(res.errors[0], 'bad'); haptic('bad'); return; }
    var json = JSON.stringify(res.payload);
    if (!inTelegram) {
      flash('Dibuka di luar Telegram, jadi tidak dikirim. JSON disalin untuk uji.', 'ok');
      try { navigator.clipboard.writeText(json); } catch (e) {}
      rememberProject(res.payload.proyek);
      window.__lastPayload = json; return;
    }
    rememberProject(res.payload.proyek);
    clearDraft();
    try { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    tg.sendData(json);
  }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      state.mode = t.dataset.mode; state.active = defaultActive(state.mode); fresh = true; render();
    });
  });
  $('nama').value = state.nama; $('proyek').value = state.proyek; $('paksa').value = state.paksa;
  [['nama', 'nama'], ['proyek', 'proyek'], ['paksa', 'paksa']].forEach(function (x) {
    var el = $(x[0]);
    el.addEventListener('input', function (e) { state[x[1]] = e.target.value; render(); });
    el.addEventListener('focus', function () { document.body.classList.add('typing'); });
    el.addEventListener('blur', function () { document.body.classList.remove('typing'); });
  });
  $('undoDock').addEventListener('click', function () { state.segs.pop(); haptic(); render(); });
  $('go').addEventListener('click', send);
  if (!inTelegram) $('go').textContent = 'Salin JSON (uji, di luar Telegram)';
  if ((state.open.pintu.concat(state.open.jendela, state.open.kolom)).some(function (r) { return r.q || r.w || r.h; })) $('bukaan').open = true;

  if (tg) {
    try { tg.ready(); tg.expand(); tg.setHeaderColor('#0e1013'); tg.setBackgroundColor('#0e1013');
          if (typeof tg.enableClosingConfirmation === 'function') tg.enableClosingConfirmation();
          if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes(); } catch (e) {}
  }
  fillProjects();
  render();
})();
</script>
